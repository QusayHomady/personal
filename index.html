<!DOCTYPE html>
<html>
<head>
  <base href="/personal/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="personal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>personal</title>
  <link rel="manifest" href="manifest.json">

  <!-- Lottie Web Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      background-color: #292D32;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #splash-animation {
      width: 300px;
      height: 300px;
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      document.getElementById("splash-container")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <div id="splash-container">
    <div id="splash-animation"></div>
  </div>

  <script>
    // تحميل Lottie JSON وتشغيله
    lottie.loadAnimation({
      container: document.getElementById('splash-animation'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: 'assets/lod.json' // مسار ملف JSON
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
